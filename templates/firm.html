{% extends "base.html" %}
{% block content %}
<div class="select_box">
    <form class="select_firm" action="/firm" method="post">
        <select class="list" name="firm_id">
            {% for f in firm %}
            <p>{{ f }}</p>
            <option value="{{f[0]}}">{{f[1]}}</option>
            {% endfor %}
        </select>
        <p style="font-size: large;">{{data2}}</p>
        <br>
        <button class="ssmt" type="submit">SELECT KINGDOM</button><br>
        <a href="/add_firm">➕Add Firm</a>
    </form>
</div>
{% endblock %}
{% block extra_scripts %}{% endblock %}
