<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>
    <link rel="stylesheet" href="/static/styles/styles.css">
  
</head>
<body>

<table border="1">
    <tr>
        <th>Id</th>
        <th>Product Name</th>
        <th>Price</th>
        <th>Image</th>
        <th>Barcode</th>
        <th>Action</th>
    </tr>

    {% for pro in products %}
    <tr>
        <td>{{ pro[0] }}</td>
        <td>{{ pro[1] }}</td>
        <td>{{ pro[2] }}</td>

        <!-- ✅ Correct image display -->
        <td>
            <img class="image" src="data:image/jpeg;base64,{{ pro[3]|b64encode }}">
        </td>
        <th>{{ pro[4] }}</th>

        <td>
            <a href="/edit/{{ pro[0] }}">
                <button>Edit</button>
            </a>
            <a href="/delete/{{ pro[0] }}">
                <button>Delete</button>
            </a>
        </td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
