<!DOCTYPE html>
<html>
<head>
    <title>Buy Subscription</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            text-align: center;
        }

        .container {
            margin-top: 50px;
        }

        .plan {
            display: inline-block;
            background: white;
            padding: 20px;
            margin: 15px;
            border-radius: 10px;
            width: 250px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        .plan h2 {
            color: #333;
        }

        .price {
            font-size: 24px;
            color: green;
        }

        button {
            background: #28a745;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Choose Your Plan</h1>

    <!-- Basic Plan -->
    <div class="plan">
        <h2>Basic Plan</h2>
        <p class="price">₹199 / Month</p>
        <p>✔ Billing System</p>
        <p>✔ Inventory</p>
        <button onclick="buyPlan('monthly')">Buy Now</button>
    </div>

    <!-- Premium Plan -->
    <div class="plan">
        <h2>Premium Plan</h2>
        <p class="price">₹499 / Month</p>
        <p>✔ Multi Shop</p>
        <p>✔ Reports</p>
        <button onclick="buyPlan('premium')">Buy Now</button>
    </div>

</div>

<script>
function buyPlan(plan) {
    window.location.href = "/buy_subscription/" + plan;
}
</script>

</body>
</html>
