<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sub_rate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='/styles/devstyles.css')}}">
</head>
<body>
    <table class="rate table">
        <tr>
            <th>ID</th>
            <th>PLAN_NAME</th>
            <th>DAYS</th>
            <th>PRICE</th>
            <th>ACTION</th>
        </tr>
        {% for price in prices %}
        <tr>
            <td>{{price[0]}}</td>
            <td>{{price[1]}}</td>
            <td>{{price[2]}}</td>
            <td>{{price[3]}}</td>
            <td>
                <a href="/sub/edit/{{price[0]}}">
                    <button type="submit">Edit</button>
                </a>
            </td>
        </tr>
         {% endfor %}
    </table>
   
</body>
</html>
